# SPDX-License-Identifier: Apache-2.0
# Publishes a GitHub release with fido-probe for Linux (amd64, arm64) and
# macOS (amd64, arm64), ffwd-usbfs for Linux (amd64, arm64), the paper as
# a PDF, and their SHA-256 sums.
#
# Runs once a month and by hand. It releases only when main has changed
# since the last release: it checks first and builds second. The tag is the
# UTC date, vYYYY.M.D, with a fourth part when a release already has that
# date.
name: release
on:
  schedule:
    - cron: "41 5 1 * *" # monthly, on the 1st at 05:41 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything to release?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Fail open: if the last release cannot be read, release.
          last="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)"
          prev=""
          if [ -n "$last" ]; then
            prev="$(gh api "repos/${REPO}/git/refs/tags/${last}" --jq '.object.sha' 2>/dev/null || true)"
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ] && [ "$prev" = "$GITHUB_SHA" ]; then
            echo "main is already released as $last; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $GITHUB_SHA (last release: ${last:-none})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          v="$(date -u +%Y.%-m.%-d)"
          n=0; candidate="$v"
          while git rev-parse -q --verify "refs/tags/v$candidate" >/dev/null; do
            n=$((n + 1)); candidate="$v.$n"
          done
          echo "version=$candidate" >> "$GITHUB_OUTPUT"
      - uses: bazelbuild/setup-bazelisk@v3
        if: steps.changed.outputs.changed == 'true'
      - name: Test and build
        if: steps.changed.outputs.changed == 'true'
        run: |
          bazel test //...
          bazel build -c opt //cmd/fido-probe:all //cmd/ffwd-usbfs:all //paper:yubikey-forward
      - name: Collect the release files
        if: steps.changed.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            f="$(bazel cquery -c opt "//cmd/fido-probe:fido-probe_${plat}" --output=files 2>/dev/null)"
            cp "$f" "dist/fido-probe-${VERSION}-${plat}"
          done
          for plat in linux_amd64 linux_arm64; do
            f="$(bazel cquery -c opt "//cmd/ffwd-usbfs:ffwd-usbfs_${plat}" --output=files 2>/dev/null)"
            cp "$f" "dist/ffwd-usbfs-${VERSION}-${plat}"
          done
          cp bazel-bin/paper/yubikey-forward.pdf "dist/yubikey-forward-${VERSION}.pdf"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.changed.outputs.last }}
        run: |
          {
            echo "fido-probe checks that this machine can reach a FIDO key's CTAPHID interface."
            echo "ffwd-usbfs forwards the key's FIDO interface over SSH to fido-forward's sink (TESTPLAN.md, T4)."
            echo "Linux binaries are static; on ChromeOS run the linux one in the Linux container."
            echo "See TESTPLAN.md for how to use it. The paper is the design study."
            echo
            if [ -n "$LAST" ]; then
              echo "Changes since $LAST:"
              git log --format='- %s (%h)' "$LAST..HEAD"
            fi
          } > notes.md
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "yubikey-forward $VERSION" --notes-file notes.md
